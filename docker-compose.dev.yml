services:
  website:
    container_name: website-dev
    build:
      context: .
      dockerfile: ./Dockerfile
      target: dev
    environment:
      HOST: 0.0.0.0
    volumes:
      - ./app:/src/app
      - ./public:/src/public
      - ./nuxt.config.ts:/src/nuxt.config.ts
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - global_dev
  
  postgres:
    container_name: postgres-dev
    image: 'postgres:18.6'
    env_file:
      - .env
    volumes:
      - ./databases:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
        - '5430:5432'
    networks:
      - global_dev

networks:
    global_dev:
    