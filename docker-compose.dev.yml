services:
  website:
    container_name: website-dev
    build:
      context: .
      target: dev
    environment:
      - HOST=0.0.0.0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - ./.nuxt:/src/.nuxt
      - ./app:/src/app
      - ./public:/src/public
      - ./server:/src/server
      - ./shared:/src/shared
      - ./nuxt.config.ts:/src/nuxt.config.ts
      - ./prisma:/src/prisma
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - global_dev
  
  postgres:
    container_name: postgres-dev
    image: 'postgres:18.6'
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./databases:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '127.0.0.1:5430:5432'
    networks:
      - global_dev

networks:
    global_dev:
