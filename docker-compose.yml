services:
  website:
    container_name: website-prod
    build:
      context: .
      dockerfile: ./Dockerfile
      target: prod
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - global
  
  postgres:
    container_name: postgres-prod
    image: 'postgres:18.6'
    env_file:
      - .env
    volumes:
      - ./databases:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - global

networks:
    global:
    